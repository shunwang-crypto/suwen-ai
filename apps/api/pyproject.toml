[project]
name = "eduagents-api"
version = "0.1.0"
description = "EduAgents FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "eduagents-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "pillow>=10.0",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
