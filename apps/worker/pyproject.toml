[project]
name = "eduagents-worker"
version = "0.1.0"
description = "EduAgents ARQ background worker (document ingestion, reflection, KC building)"
requires-python = ">=3.12"
dependencies = [
    "eduagents-core",
    "eduagents-api",
    "arq>=0.26",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
