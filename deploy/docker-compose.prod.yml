name: eduagents-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      POSTGRES_USER: edu_migration
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - eduagents_prod_pg_data:/var/lib/postgresql/data
      - ./postgres-init/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - eduagents_prod_redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes:
      - eduagents_prod_qdrant_data:/qdrant/storage
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - eduagents_prod_minio_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    restart: "no"
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY is required}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
    volumes:
      - ./minio-init:/config:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]
    entrypoint: ["/bin/sh", "/config/init.sh"]
    logging: *default-logging

  migrate:
    image: eduagents-api:${EDUAGENTS_IMAGE_TAG:-64ff991}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: "no"
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://edu_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://edu_migration:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging

  api:
    image: eduagents-api:${EDUAGENTS_IMAGE_TAG:-64ff991}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://edu_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Deliberately empty: the API image must not possess migration credentials.
      MIGRATION_DATABASE_URL: ""
      POSTGRES_MIGRATION_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCAL_PATH: ""
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY is required}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY is required}
      MINIO_SECURE: "false"
      GATEWAY_MODE: live
      GATEWAY_REPLAY_FALLBACK_STUB: "false"
      EMBEDDING_MODE: live
      RERANK_MODE: live
      WEB_IMPORT_ALLOW_PRIVATE_HOSTS: "false"
      ENABLE_TIME_TRAVEL: "0"
      PAYMENT_PROVIDER: disabled
      ENABLE_FAULT_INJECTION: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [backend, egress]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: ["uvicorn", "eduagents_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=172.16.0.0/12"]
    logging: *default-logging

  worker:
    image: eduagents-api:${EDUAGENTS_IMAGE_TAG:-64ff991}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://edu_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      MIGRATION_DATABASE_URL: ""
      POSTGRES_MIGRATION_PASSWORD: ""
      POSTGRES_APP_PASSWORD: ""
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_LOCAL_PATH: ""
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY is required}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY is required}
      MINIO_SECURE: "false"
      GATEWAY_MODE: live
      GATEWAY_REPLAY_FALLBACK_STUB: "false"
      EMBEDDING_MODE: live
      RERANK_MODE: live
      WEB_IMPORT_ALLOW_PRIVATE_HOSTS: "false"
      ENABLE_TIME_TRAVEL: "0"
      PAYMENT_PROVIDER: disabled
      ENABLE_FAULT_INJECTION: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [backend, egress]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncio, os; from redis.asyncio import Redis; ok=asyncio.run(Redis.from_url(os.environ['REDIS_URL']).exists('arq:queue:health-check')); raise SystemExit(0 if ok else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: ["arq", "eduagents_worker.main.WorkerSettings"]
    logging: *default-logging

  web:
    image: eduagents-web:${EDUAGENTS_IMAGE_TAG:-64ff991}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      network: host
      args:
        EDU_API_ORIGIN: http://api:8000
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-../.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - eduagents_prod_caddy_data:/data
      - eduagents_prod_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true
  egress:
    driver: bridge

volumes:
  eduagents_prod_pg_data:
  eduagents_prod_redis_data:
  eduagents_prod_qdrant_data:
  eduagents_prod_minio_data:
  eduagents_prod_caddy_data:
  eduagents_prod_caddy_config:
