# M1-D1 验证用 override: 仅平移宿主端口(开发机上 conda 版 PG/Redis/Qdrant/API
# 正占用默认端口), 容器内拓扑/健康检查/镜像与 docker-compose.yml 完全一致。
# 用法: docker compose -f docker-compose.yml -f compose.validate.yml up -d
# 构建走宿主网络以复用本机代理(127.0.0.1:7890, 机器仅代理出口可用)。
services:
  postgres:
    ports: !override
      - "15432:5432"
  redis:
    ports: !override
      - "16379:6379"
  qdrant:
    ports: !override
      - "16333:6333"
  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"
  api:
    build:
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7890
        HTTPS_PROXY: http://127.0.0.1:7890
        NO_PROXY: localhost,127.0.0.1
    ports: !override
      - "18000:8000"
    environment:
      # 验证栈离线口径: 嵌入/重排也走桩(容器内无法达宿主 127.0.0.1 代理);
      # 生产部署时删除本 override 即恢复 .env 的 live 配置
      EMBEDDING_MODE: stub
      RERANK_MODE: stub
      GATEWAY_MODE: stub
  worker:
    build:
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7890
        HTTPS_PROXY: http://127.0.0.1:7890
        NO_PROXY: localhost,127.0.0.1
    environment:
      EMBEDDING_MODE: stub
      RERANK_MODE: stub
      GATEWAY_MODE: stub
  caddy:
    ports: !override
      - "18080:8080"
