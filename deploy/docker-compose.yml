name: eduagents

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: eduagents
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d eduagents"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: eduagents
      MINIO_ROOT_PASSWORD: eduagents-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://edu_app:edu@postgres:5432/eduagents
      MIGRATION_DATABASE_URL: postgresql+asyncpg://edu:edu@postgres:5432/eduagents
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # P1-2: 打就绪探针 — PG/Redis/Qdrant 任一挂时 /ready 返 503, urlopen 抛
      # HTTPError, 实例被标 unhealthy, Caddy (depends_on: service_healthy) 摘流量
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    # P0-1: --proxy-headers 信任 Caddy 注入的 X-Forwarded-For, 限流按真实客户端
    # IP 分桶; --forwarded-allow-ips 收敛到 compose 默认网段 (不要用 *, 否则 XFF
    # 变攻击者可控 → 撞库防护旁路)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn eduagents_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.16.0.0/12"

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://edu_app:edu@postgres:5432/eduagents
      MIGRATION_DATABASE_URL: postgresql+asyncpg://edu:edu@postgres:5432/eduagents
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "eduagents_worker.main.WorkerSettings"]

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  minio_data:
