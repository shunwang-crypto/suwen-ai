# sdk-minimal remains the kernel; only the injected educational adapter can call models.
- id: llm-deepseek
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: compaction-basic
  disabled: true
- id: image-offload
  disabled: true
- id: llm-retry
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: 'You are an educational assistant. Follow the host task and use only the provided educational tools.'
- insert:
    - id: education-bridge
      name: EDU_DSH_PLUGIN_PATH
      inject: [llm, tools]
