[project]
name = "eduagents-core"
version = "0.1.0"
description = "EduAgents core domain package: config, clock, logging, model gateway, protocols"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "openai>=1.40",
    "tenacity>=8.3",
    "orjson>=3.10",
    "xxhash>=3.4",
    "httpx>=0.27",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "jieba>=0.42",
    "qdrant-client>=1.9",
    "aiofiles>=23.2",
    "trafilatura>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 内容审核词表随包分发 (可替换文件, 见 eduagents_core/moderation.py)
eduagents_core = ["data/*.txt"]
